dataset: TartanAirV2
environment: OldTownSummer
trajectory: P000
start_frame: 200
frame_count: 100
time_window_seconds: [20.0, 29.9]
camera_rate_hz: 10
imu_rate_hz: 100
modes:
  - rgb
  - rgb_imu
  - rgbd_imu
seeds: [0, 1, 2]
alignments:
  rgb: sim3
  rgb_imu: se3
  rgbd_imu: se3
rpe_delta: 1.0
rpe_delta_unit: meters
trajectory_source: per_frame_body
optimized_trajectory: diagnostic_only
map_policy: fixed_window_requires_single_map
invalid_map_policy: ate_rpe_na
thread_environment:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
